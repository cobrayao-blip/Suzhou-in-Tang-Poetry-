# 本地开发：PostgreSQL + Meilisearch
# 启动：docker compose up -d
# Meilisearch：http://127.0.0.1:7700
# PostgreSQL：127.0.0.1:5432

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qts_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-quatangshi}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qts} -d ${POSTGRES_DB:-quatangshi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
    volumes:
      - meili_data:/meili_data

volumes:
  pg_data:
  meili_data:

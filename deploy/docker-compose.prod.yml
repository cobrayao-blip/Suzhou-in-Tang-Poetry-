# 全唐诗检索 — 生产 Compose
# 项目根执行：
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# 首次导入数据：
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod --profile bootstrap run --rm bootstrap
#
# 默认仅绑定 127.0.0.1:18080，由宿主机 Nginx 将 tp.textengine.cn 反代到此端口
# （避免与清嘉录 qjl.textengine.cn 抢占 80/443）

name: quatangshi

services:
  postgres:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quatangshi}
      POSTGRES_USER: ${POSTGRES_USER:-qts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
    volumes:
      - ${PGDATA_HOST_PATH:-/data/qts/pgdata}:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-qts} -d ${POSTGRES_DB:-quatangshi}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in deploy/.env.prod}
    volumes:
      - ${MEILI_DATA_PATH:-/data/qts/meili}:/meili_data
    restart: unless-stopped
    expose:
      - "7700"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quatangshi}
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:?}
      MEILI_INDEX: ${MEILI_INDEX:-quatangshi}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://tp.textengine.cn}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${QTS_HTTP_PORT:-18080}:80"
    restart: unless-stopped

  bootstrap:
    profiles: [bootstrap]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      target: bootstrap
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quatangshi}
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:?}
      MEILI_INDEX: ${MEILI_INDEX:-quatangshi}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: "no"

# 宿主机 Nginx（可选）：tp → 127.0.0.1:18080
# 证书仅在 /data/qts/cert/（与清嘉录无关）
#
#   sudo cp .../deploy/server/tp.textengine.cn.conf /etc/nginx/sites-available/tp.textengine.cn
#   sudo ln -sf /etc/nginx/sites-available/tp.textengine.cn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream quatangshi_local {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    server_name tp.textengine.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tp.textengine.cn;

    ssl_certificate     /data/qts/cert/tp.textengine.cn_bundle.crt;
    ssl_certificate_key /data/qts/cert/tp.textengine.cn.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://quatangshi_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

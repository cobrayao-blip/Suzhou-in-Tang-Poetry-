# tp.textengine.cn → 全唐诗（127.0.0.1:18080）
# 由服务器管理员 include 到监听 443 的 Nginx，或参考 edge-nginx.example.conf 做宿主机统一入口。

upstream quatangshi_local {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    server_name tp.textengine.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tp.textengine.cn;

    ssl_certificate     /data/certs/tp.textengine.cn/fullchain.pem;
    ssl_certificate_key /data/certs/tp.textengine.cn/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://quatangshi_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# 全唐诗 Compose「edge」服务用（profile: edge）
# 证书卷：/data/qts/cert → 容器内 /etc/nginx/ssl

upstream quatangshi_web {
    server web:80;
}

server {
    listen 80;
    server_name tp.textengine.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tp.textengine.cn;

    ssl_certificate     /etc/nginx/ssl/tp.textengine.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/tp.textengine.cn.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://quatangshi_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# 单公网 IP：挂到「当前占用 443」的 Nginx 容器（只增加 tp 域名，不改 qjl 站点配置）
# 宿主机准备：
#   sudo mkdir -p /data/nginx-extra /data/qts/cert
#   sudo cp /opt/quatangshi/deploy/server/tp.textengine.cn.mount.conf /data/nginx-extra/tp.textengine.cn.conf
# 证书放 /data/qts/cert/（见部署手册「第一步」）
# 容器需能访问宿主机 18080：extra_hosts host.docker.internal:host-gateway

upstream quatangshi_local {
    server host.docker.internal:18080;
}

server {
    listen 80;
    server_name tp.textengine.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tp.textengine.cn;

    ssl_certificate     /etc/nginx/ssl-tp/tp.textengine.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl-tp/tp.textengine.cn.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://quatangshi_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# 宿主机统一反代示例（证书路径与 tp.textengine.cn.conf 相同）

upstream site_quatangshi {
    server 127.0.0.1:18080;
}

server {
    listen 443 ssl http2;
    server_name tp.textengine.cn;

    ssl_certificate     /data/qts/cert/tp.textengine.cn_bundle.crt;
    ssl_certificate_key /data/qts/cert/tp.textengine.cn.key;

    location / {
        proxy_pass http://site_quatangshi;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

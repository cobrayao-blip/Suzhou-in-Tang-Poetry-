# 示例：宿主机 Nginx 统一监听 443（推荐长远方案）
# 安装：/etc/nginx/sites-available/textengine.conf → sites-enabled
#
# 前置：各应用只绑定 127.0.0.1 高位端口，例如
#   全唐诗  127.0.0.1:18080  （本仓库 docker-compose）
#   其他站  127.0.0.1:18081  （由该站管理员配置，与本仓库无关）

upstream site_quatangshi {
    server 127.0.0.1:18080;
}

# upstream site_other { server 127.0.0.1:18081; }

server {
    listen 80;
    server_name tp.textengine.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tp.textengine.cn;

    ssl_certificate     /data/certs/tp.textengine.cn/fullchain.pem;
    ssl_certificate_key /data/certs/tp.textengine.cn/privkey.pem;

    location / {
        proxy_pass http://site_quatangshi;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 其他域名由其他 server { } 块配置，勿与本文件混在同一项目 git 里维护。

# 可选：为 tp 单独公网 IP 时使用（与 docker-compose.prod.yml 叠加）
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.edge.yml \
#     --env-file deploy/.env.prod --profile edge up -d

name: quatangshi

services:
  edge:
    profiles: [edge]
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "${QTS_PUBLIC_IP:?set QTS_PUBLIC_IP in deploy/.env.prod}:443:443"
      - "${QTS_PUBLIC_IP:?}:80:80"
    volumes:
      - ./server/tp.textengine.cn.edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${QTS_CERT_DIR:-/data/qts/cert}:/etc/nginx/ssl:ro
    restart: unless-stopped

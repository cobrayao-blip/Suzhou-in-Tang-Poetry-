# 清嘉录 Nginx 增量配置：将 tp.textengine.cn 反代到全唐诗（宿主机 127.0.0.1:18080）
#
# 用法见 deploy/部署手册.md 第九节。
# 合并到清嘉录项目的 deploy/nginx.docker.conf 中（在现有 server { listen 443 } 之后追加本 server 块）。
#
# 若清嘉录 web 容器未配置 host.docker.internal，请在 docker-compose.prod.yml 的 web 服务下增加：
#   extra_hosts:
#     - "host.docker.internal:host-gateway"

upstream quatangshi_web {
    server host.docker.internal:18080;
}

server {
    listen 80;
    server_name tp.textengine.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tp.textengine.cn;

    ssl_certificate     /etc/nginx/ssl/tp.textengine.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/tp.textengine.cn.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://quatangshi_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

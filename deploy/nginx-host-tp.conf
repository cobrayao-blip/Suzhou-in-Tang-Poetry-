# 宿主机 Nginx：tp.textengine.cn → 全唐诗 Compose（127.0.0.1:18080）
# 安装：cp deploy/nginx-host-tp.conf /etc/nginx/conf.d/tp.textengine.cn.conf
#
# 证书（任选其一后改下面路径）：
#   certbot certonly --nginx -d tp.textengine.cn
#   或已有 *.textengine.cn 通配符时指向对应 fullchain/key

upstream quatangshi_web {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    server_name tp.textengine.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tp.textengine.cn;

    ssl_certificate     /etc/letsencrypt/live/tp.textengine.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tp.textengine.cn/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://quatangshi_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
